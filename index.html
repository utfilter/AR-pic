<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>WebAR</title>

  <script type="importmap">
    {
      "imports": {
        "three": "./three.module.js",
        "three/addons/renderers/CSS3DRenderer.js": "./CSS3DRenderer.js",
        "mindar-image-three": "./mindar-image-three.prod.js"
      }
    }
  </script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #arContainer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    #arContainer video,
    #arContainer canvas {
      pointer-events: none !important;
    }

    #startButton {
      position: fixed;
      z-index: 1000;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 22px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-size: 18px;
      pointer-events: auto;
      touch-action: manipulation;
    }

    #message {
      display: none;
      position: fixed;
      z-index: 1100;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 12px;
      border-radius: 6px;
      background: #fff;
      color: #111;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div id="arContainer"></div>

  <button id="startButton" type="button">
    Включить камеру
  </button>

  <div id="message" role="status"></div>

  <script>
    const container = document.getElementById("arContainer");
    const button = document.getElementById("startButton");
    const message = document.getElementById("message");

    function showMessage(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    let started = false;
    let mindarThree;
    let video;

    button.addEventListener("click", async () => {
      button.disabled = true;
      button.textContent = "Загружаю AR…";
      showMessage("Загружаю библиотеки…");

      try {
        if (!window.isSecureContext) {
          throw new Error("Сайт должен открываться по HTTPS.");
        }

        const THREE = await import("three");
        const mindarModule = await import("mindar-image-three");
        const MindARThree = mindarModule.MindARThree;

        if (!MindARThree) {
          throw new Error("В MindAR-модуле не найден MindARThree.");
        }

        showMessage("Настраиваю AR-сцену…");

        mindarThree = new MindARThree({
          container: container,
          imageTargetSrc: "./target.mind",
          uiLoading: "no",
          uiScanning: "yes",
          uiError: "no"
        });

        const { renderer, scene, camera } = mindarThree;
        const anchor = mindarThree.addAnchor(0);

        video = document.createElement("video");
        video.src = "./video.mp4";
        video.preload = "auto";
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");
        video.load();

        const videoTexture = new THREE.VideoTexture(video);
        videoTexture.colorSpace = THREE.SRGBColorSpace;

        // Размер плоскости 4:3 — под маркер с такими же пропорциями.
        const geometry = new THREE.PlaneGeometry(1, 0.75);
        const material = new THREE.MeshBasicMaterial({
          map: videoTexture,
          side: THREE.DoubleSide
        });

        const videoPlane = new THREE.Mesh(geometry, material);
        anchor.group.add(videoPlane);

        anchor.onTargetFound = async () => {
          try {
            await video.play();
          } catch (error) {
            showMessage("Маркер найден, но видео не запустилось: " + error.message);
          }
        };

        anchor.onTargetLost = () => {
          video.pause();
        };

        showMessage("Запрашиваю доступ к камере…");
        await mindarThree.start();
        started = true;

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

        button.style.display = "none";
        message.style.display = "none";
      } catch (error) {
        button.disabled = false;
        button.textContent = "Попробовать снова";
        showMessage("Ошибка: " + (error.message || String(error)));

        if (mindarThree && !started) {
          try {
            mindarThree.stop();
          } catch (_) {}
        }
      }
    });
  </script>
</body>
</html>
