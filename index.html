<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Используем гарантированно рабочие версии прямо из вашего репозитория -->
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      /* Полностью скрываем встроенную серую рамку сканирования и белые уголки */
      .mindar-ui-scanning, .mindar-ui-loading { display: none !important; }
    </style>
  </head>
  <body>

    <!-- uiScanning: no отключает рамки. vr-mode-ui="enabled: false" навсегда убирает кнопку VR -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF:0.001; filterBeta:0.01; uiScanning: no;" 
             embedded
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Добавили принудительный muted для автоматического обхода ограничений Android -->
        <video id="ar-video" src="./video.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Наведение на чистую картинку робо-козы -->
      
        <!-- Задаем ровные прямоугольные пропорции для видео (ширина 1.5, высота 0.9) -->
        <a-video src="#ar-video" width="1.5" height="0.9" position="0 0 0" rotation="0 0 0"></a-video>
      
    </a-scene>

    <script>
      const targetEntity = document.querySelector('#target-entity');
      const video = document.querySelector('#ar-video');
      
      // Логика переключения без сбоев в памяти браузера
      targetEntity.addEventListener("targetFound", () => { 
        video.play().catch(err => console.log("Автозапуск заблокирован", err)); 
      });
      
      targetEntity.addEventListener("targetLost", () => { 
        video.pause(); 
      });
    </script>
  </body>
</html>
