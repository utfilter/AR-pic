<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Подключаем файлы, которые вы только что загрузили -->
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
    </style>
  </head>
  <body>

    <!-- Запуск сцены без рамок. Моментальный старт камеры -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF:0.001; filterBeta:0.01;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Видео без предзагрузки, чтобы не вешать телефон -->
        <video id="ar-video" src="./video.mp4" preload="none" loop muted playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Наведение на чистую картинку -->
      
        <a-video src="#ar-video" width="1" height="1" position="0 0 0" rotation="0 0 0"></a-video>
      
    </a-scene>

    <script>
      const targetEntity = document.querySelector('#target-entity');
      const video = document.querySelector('#ar-video');
      
      targetEntity.addEventListener("targetFound", () => { 
        video.play(); 
      });
      
      targetEntity.addEventListener("targetLost", () => { 
        video.pause(); 
      });
    </script>
  </body>
</html>
