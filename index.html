<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Подключаем стабильные и легкие веб-компоненты напрямую -->
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
    </style>
  </head>
  <body>

    <!-- Задаем HD разрешение для камеры телефона и убираем кнопку VR раз и навсегда -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF:0.0001; filterBeta:0.005;" 
             embedded
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="ar-video" src="./video.mp4" preload="none" loop muted playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Автоматическое масштабирование под пропорции вашей картинки -->
      
        <!-- Поставили универсальный размер 1.4 на 0.8, который идеально перекроет прямоугольную козу -->
        <a-video src="#ar-video" width="1.4" height="0.8" position="0 0 0" rotation="0 0 0"></a-video>
      
    </a-scene>

    <script>
      const targetEntity = document.querySelector('#target-entity');
      const video = document.querySelector('#ar-video');
      
      targetEntity.addEventListener("targetFound", () => { video.play(); });
      targetEntity.addEventListener("targetLost", () => { video.pause(); });
    </script>
  </body>
</html>
