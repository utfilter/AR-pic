<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>WebAR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #startButton {
      position: fixed;
      z-index: 10;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 22px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-size: 18px;
    }

    #message {
      display: none;
      position: fixed;
      z-index: 20;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 12px;
      border-radius: 6px;
      background: #fff;
      color: #111;
      overflow-wrap: anywhere;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Видео нужно загрузить без отображения отдельным элементом */
    #arVideo {
      display: none;
    }
  </style>
</head>

<body>
  <button id="startButton">Включить камеру</button>
  <div id="message" role="status"></div>

  <a-scene
    mindar-image="imageTargetSrc: ./target.mind; autoStart: false; uiLoading: no; uiScanning: yes; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="arVideo"
        src="./video.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        muted
        loop
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity id="marker" mindar-image-target="targetIndex: 0">
      <!-- Прямоугольник 4:3, закрывающий всю область маркера -->
      <a-video
        src="#arVideo"
        width="1"
        height="0.75"
        position="0 0 0.01">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    const button = document.getElementById("startButton");
    const message = document.getElementById("message");
    const video = document.getElementById("arVideo");
    const marker = document.getElementById("marker");
    const scene = document.querySelector("a-scene");

    function showMessage(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    function waitForEvent(element, eventName, timeoutMs, timeoutText) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          reject(new Error(timeoutText));
        }, timeoutMs);

        element.addEventListener(eventName, () => {
          clearTimeout(timer);
          resolve();
        }, { once: true });
      });
    }

    marker.addEventListener("targetFound", async () => {
      try {
        video.muted = true;
        await video.play();
      } catch (error) {
        showMessage("Маркер найден, но видео не запустилось: " + error.message);
      }
    });

    marker.addEventListener("targetLost", () => {
      video.pause();
    });

    button.addEventListener("click", async () => {
      button.disabled = true;
      button.textContent = "Загрузка AR…";
      showMessage("Проверяю загрузку страницы…");

      try {
        if (!window.isSecureContext) {
          throw new Error("Страница должна открываться по HTTPS.");
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Браузер не предоставляет доступ к камере. Откройте сайт в Chrome.");
        }

        if (!scene.hasLoaded) {
          showMessage("Жду загрузки AR-сцены…");
          await waitForEvent(
            scene,
            "loaded",
            15000,
            "AR-сцена не загрузилась за 15 секунд. Проверьте интернет и перезагрузите страницу."
          );
        }

        const mindar = scene.systems["mindar-image"];

        if (!mindar) {
          throw new Error("MindAR не загрузился. Проверьте интернет и обновите страницу.");
        }

        button.textContent = "Запрашиваю камеру…";
        showMessage("Ожидаю запуск камеры. Если появится запрос доступа, нажмите «Разрешить».");

        await Promise.race([
          mindar.start(),
          new Promise((_, reject) => {
            setTimeout(() => {
              reject(new Error("Запуск камеры не завершился за 20 секунд. Проверьте разрешение камеры для сайта в Chrome."));
            }, 20000);
          })
        ]);

        message.style.display = "none";
        button.style.display = "none";
      } catch (error) {
        button.disabled = false;
        button.textContent = "Попробовать снова";
        showMessage("Ошибка: " + (error.message || error));
      }
    });
  </script>
</body>
</html>
