<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Подключаем только необходимые библиотеки -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>

    <!-- Запускаем сцену автоматически (autoStart: true) -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF:0.001; filterBeta:0.01;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Добавили параметр muted, чтобы телефон не блокировал запуск видео -->
        <video id="ar-video" src="./video.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      
        <a-video src="#ar-video" width="1" height="1" position="0 0 0" rotation="0 0 0"></a-video>
      
    </a-scene>

    <script>
      const targetEntity = document.querySelector('#target-entity');
      const video = document.querySelector('#ar-video');

      targetEntity.addEventListener("targetFound", () => { 
        video.play(); 
      });
      
      targetEntity.addEventListener("targetLost", () => { 
        video.pause(); 
      });
    </script>
  </body>
</html>
