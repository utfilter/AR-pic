<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Подключаем только ядро MindAR (без тяжелого движка A-Frame) -->
    <script src="https://jsdelivr.net"></script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      /* Стили для того, чтобы видео ровно приклеивалось к картинке */
      #container { width: 100%; height: 100%; position: relative; }
      #ar-video { display: none; position: absolute; transform-origin: top left; z-index: 10; }
    </style>
  </head>
  <body>

    <div id="container">
      <!-- Наше видео, изначально скрыто -->
      <video id="ar-video" src="./video.mp4" loop muted playsinline webkit-playsinline></video>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const video = document.querySelector("#ar-video");
        const container = document.querySelector("#container");

        // Запуск контроллера MindAR напрямую
        const mindarThree = new window.MINDAR.IMAGE.MindARImage({
          container: container,
          imageTargetSrc: './targets.mind',
          filterMinCF: 0.001,
          filterBeta: 0.01
        });

        // Старт камеры
        mindarThree.start().then(() => {
          console.log("Камера успешно запущена");
        }).catch(err => {
          alert("Запрещен доступ к камере или браузер не поддерживается: " + err);
        });

        // Отслеживание маркера
        mindarThree.on("targetFound", (index) => {
          // Получаем координаты картинки в реальном времени
          const pos = mindarThree.getCoordinate(index);
          if (pos) {
            video.style.left = pos.left + "px";
            video.style.top = pos.top + "px";
            video.style.width = pos.width + "px";
            video.style.height = pos.height + "px";
            video.style.display = "block";
            video.play();
          }
        });

        mindarThree.on("targetUpdate", (index) => {
          const pos = mindarThree.getCoordinate(index);
          if (pos) {
            video.style.left = pos.left + "px";
            video.style.top = pos.top + "px";
            video.style.width = pos.width + "px";
            video.style.height = pos.height + "px";
          }
        });

        mindarThree.on("targetLost", () => {
          video.pause();
          video.style.display = "none";
        });
      });
    </script>
  </body>
</html>
