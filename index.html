<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>WebAR без A-Frame</title>

  <script type="importmap">
    {
      "imports": {
        "three": "./three.module.js",
        "mindar-image-three": "./mindar-image-three.prod.js"
      }
    }
  </script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #arContainer {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #startButton {
      position: fixed;
      z-index: 10;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 22px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-size: 18px;
    }

    #message {
      display: none;
      position: fixed;
      z-index: 20;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 12px;
      border-radius: 6px;
      background: #fff;
      color: #111;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div id="arContainer"></div>
  <button id="startButton">Включить камеру</button>
  <div id="message" role="status"></div>

  <script type="module">
    import * as THREE from "three";
    import { MindARThree } from "mindar-image-three";

    const container = document.getElementById("arContainer");
    const button = document.getElementById("startButton");
    const message = document.getElementById("message");

    function showMessage(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    let mindarThree;
    let video;
    let started = false;

    button.addEventListener("click", async () => {
      button.disabled = true;
      button.textContent = "Запускаю камеру…";
      showMessage("Подключаю AR…");

      try {
        if (!window.isSecureContext) {
          throw new Error("Сайт должен открываться по HTTPS.");
        }

        mindarThree = new MindARThree({
          container,
          imageTargetSrc: "./target.mind",
          uiLoading: "no",
          uiScanning: "yes",
          uiError: "no"
        });

        const { renderer, scene, camera } = mindarThree;
        const anchor = mindarThree.addAnchor(0);

        video = document.createElement("video");
        video.src = "./video.mp4";
        video.preload = "auto";
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");
        video.load();

        const texture = new THREE.VideoTexture(video);
        texture.colorSpace = THREE.SRGBColorSpace;

        const geometry = new THREE.PlaneGeometry(1, 0.75);
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          side: THREE.DoubleSide
        });

        const plane = new THREE.Mesh(geometry, material);
        anchor.group.add(plane);

        anchor.onTargetFound = async () => {
          try {
            await video.play();
          } catch (error) {
            showMessage("Маркер найден, но видео не запустилось: " + error.message);
          }
        };

        anchor.onTargetLost = () => {
          video.pause();
        };

        await mindarThree.start();
        started = true;

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

        button.style.display = "none";
        message.style.display = "none";
      } catch (error) {
        button.disabled = false;
        button.textContent = "Попробовать снова";
        showMessage("Ошибка запуска: " + (error.message || error));

        if (mindarThree && !started) {
          try {
            mindarThree.stop();
          } catch (_) {}
        }
      }
    });
  </script>
</body>
</html>
