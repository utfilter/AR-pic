<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>WebAR</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #ar-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #start-button {
      position: fixed;
      z-index: 10;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 22px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-size: 17px;
      cursor: pointer;
    }

    #start-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      position: fixed;
      z-index: 10;
      right: 12px;
      bottom: 12px;
      left: 12px;
      color: #fff;
      text-align: center;
      text-shadow: 0 1px 4px #000;
      font-size: 14px;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "./three.module.js",
      "three/addons/renderers/CSS3DRenderer.js": "./CSS3DRenderer.js"
    }
  }
  </script>
</head>

<body>
  <div id="ar-container"></div>
  <button id="start-button" type="button">Запустить AR</button>
  <div id="status">Наведите камеру на изображение-маркер</div>

  <video
    id="ar-video"
    src="./video.mp4"
    preload="auto"
    muted
    playsinline
    webkit-playsinline
    loop
    style="display: none"
  ></video>

  <script type="module">
    const startButton = document.querySelector("#start-button");
    const status = document.querySelector("#status");
    const video = document.querySelector("#ar-video");
    const container = document.querySelector("#ar-container");

    let mindarThree;

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      status.textContent = "Загрузка AR…";

      try {
        const THREE = await import("three");

        // Импортируем MindAR локально.
        const { MindARThree } =
          await import("./mindar-image-three.prod.js");

        // Проверяем также локальный файл CSS3DRenderer.
        // Для видеоплоскости он не используется.
        await import("three/addons/renderers/CSS3DRenderer.js");

        mindarThree = new MindARThree({
          container,
          imageTargetSrc: "./target.mind"
        });

        const { renderer, scene, camera } = mindarThree;

        const anchor = mindarThree.addAnchor(0);

        const videoTexture = new THREE.VideoTexture(video);
        videoTexture.colorSpace = THREE.SRGBColorSpace;

        const material = new THREE.MeshBasicMaterial({
          map: videoTexture,
          side: THREE.DoubleSide
        });

        // Размер плоскости соответствует пропорциям маркера 4:3.
        const geometry = new THREE.PlaneGeometry(1, 0.75);
        const videoPlane = new THREE.Mesh(geometry, material);

        anchor.group.add(videoPlane);

        anchor.onTargetFound = () => {
          status.textContent = "Маркер найден";
          video.play().catch((error) => {
            console.error("Не удалось запустить видео:", error);
            status.textContent = "Не удалось запустить видео";
          });
        };

        anchor.onTargetLost = () => {
          status.textContent = "Наведите камеру на изображение-маркер";
          video.pause();
        };

        await mindarThree.start();

        startButton.style.display = "none";
        status.textContent = "Наведите камеру на изображение-маркер";

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });
      } catch (error) {
        console.error("Ошибка запуска AR:", error);
        status.textContent = `Ошибка запуска: ${error.message}`;
        startButton.disabled = false;
        startButton.textContent = "Попробовать снова";
      }
    });
  </script>
</body>
</html>
