<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js"></script>
    <style>
      /* Жестко фиксируем тело и холст под размеры мобильного экрана */
      html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
      
      /* Перебиваем внутренние стили библиотек, чтобы убрать черный экран в вертикальном режиме */
      .a-canvas, video, a-scene { 
        width: 100vw !important; 
        height: 100vh !important; 
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        object-fit: cover !important; 
      }
      
      /* Полностью скрываем рамку сканирования */
      .mindar-ui-scanning, .mindar-ui-loading { display: none !important; }
    </style>
  </head>
  <body>

    <!-- Убираем UI сканирования и фиксируем сцену -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF:0.0001; filterBeta:0.005; uiScanning: no;" 
             embedded
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="ar-video" src="./video.mp4" preload="none" loop muted playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      
        <!-- Оптимальный прямоугольный размер видеоролика под вашу картинку с робо-козой -->
        <a-video src="#ar-video" width="1.4" height="0.8" position="0 0 0" rotation="0 0 0"></a-video>
      
    </a-scene>

    <script>
      const targetEntity = document.querySelector('#target-entity');
      const video = document.querySelector('#ar-video');
      
      targetEntity.addEventListener("targetFound", () => { video.play(); });
      targetEntity.addEventListener("targetLost", () => { video.pause(); });
    </script>
  </body>
</html>
