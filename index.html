<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Подключаем файл mindar-image.prod.js, который вы скинули -->
    <script src="./mindar-image.prod.js"></script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #container { width: 100%; height: 100%; position: relative; }
      
      /* Прячем видео до тех пор, пока картинка не найдется */
      #ar-video { display: none; position: absolute; transform-origin: top left; z-index: 10; pointer-events: none; }
      
      /* Заставляем системную камеру MindAR растянуться на весь экран Android без черных полос */
      #container video { 
        width: 100vw !important; 
        height: 100vh !important; 
        object-fit: cover !important; 
        position: absolute !important; 
        top: 0 !important; 
        left: 0 !important; 
      }
    </style>
  </head>
  <body>

    <div id="container">
      <!-- Ваше видео -->
      <video id="ar-video" src="./video.mp4" loop muted playsinline webkit-playsinline></video>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const video = document.querySelector("#ar-video");
        const container = document.querySelector("#container");

        // Инициализируем контроллер MindAR со строгим отключением встроенных рамок (uiScanning: no)
        const mindarImage = new window.MINDAR.IMAGE.MindARImage({
          container: container,
          imageTargetSrc: './targets.mind',
          filterMinCF: 0.0001,
          filterBeta: 0.001,
          uiScanning: "no",
          uiLoading: "no"
        });

        // Запускаем камеру стандартным и безопасным методом библиотеки
        mindarImage.start().then(() => {
          console.log("Камера успешно запущена в полном разрешении");
        }).catch(err => {
          alert("Ошибка доступа к камере: " + err);
        });

        // Событие: картинка найдена — вычисляем её размеры на экране телефона и приклеиваем видео
        mindarImage.on("targetFound", (index) => {
          const pos = mindarImage.getCoordinate(index);
          if (pos) {
            video.style.left = pos.left + "px";
            video.style.top = pos.top + "px";
            video.style.width = pos.width + "px";
            video.style.height = pos.height + "px";
            video.style.display = "block";
            video.play();
          }
        });

        // Событие: телефон двигается — плавно перемещаем видео вслед за картинкой
        mindarImage.on("targetUpdate", (index) => {
          const pos = mindarImage.getCoordinate(index);
          if (pos) {
            video.style.left = pos.left + "px";
            video.style.top = pos.top + "px";
            video.style.width = pos.width + "px";
            video.style.height = pos.height + "px";
          }
        });

        // Событие: картинка ушла из кадра — ставим на паузу и прячем ролик
        mindarImage.on("targetLost", () => {
          video.pause();
          video.style.display = "none";
        });
      });
    </script>
  </body>
</html>
