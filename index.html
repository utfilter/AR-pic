<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR-видео</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #ar-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #start-button {
      position: fixed;
      z-index: 10;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 22px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-size: 17px;
      cursor: pointer;
    }

    #start-button:disabled {
      opacity: 0.65;
    }

    #status {
      position: fixed;
      z-index: 10;
      right: 12px;
      bottom: 12px;
      left: 12px;
      color: #fff;
      text-align: center;
      text-shadow: 0 1px 4px #000;
      font-size: 14px;
      pointer-events: none;
    }

    #ar-video {
      display: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "./three.module.js",
      "three/addons/renderers/CSS3DRenderer.js": "./CSS3DRenderer.js",
      "three/examples/jsm/renderers/CSS3DRenderer.js": "./CSS3DRenderer.js"
    }
  }
  </script>
</head>

<body>
  <div id="ar-container"></div>
  <button id="start-button" type="button">Включить камеру</button>
  <div id="status">Нажмите кнопку и наведите камеру на маркер</div>

  <video
    id="ar-video"
    src="./video.mp4"
    preload="auto"
    muted
    playsinline
    webkit-playsinline
    loop>
  </video>

  <script type="module">
    const container = document.querySelector("#ar-container");
    const startButton = document.querySelector("#start-button");
    const status = document.querySelector("#status");
    const video = document.querySelector("#ar-video");

    startButton.addEventListener("click", startAR);

    async function startAR() {
      startButton.disabled = true;
      status.textContent = "Загрузка AR…";

      try {
        const THREE = await import("three");

        const mindarModule =
          await import("./libs/mindar-image-three.prod.js");

        const MindARThree = mindarModule.MindARThree;

        if (!MindARThree) {
          throw new Error(
            "В файле MindAR не найден экспорт MindARThree."
          );
        }

       const mindarThree = new MindARThree({
       container: container,
       imageTargetSrc: "./target.mind",
       filterMinCF: 0.0001,
       filterBeta: 250
       });

        const { renderer, scene, camera } = mindarThree;
        const anchor = mindarThree.addAnchor(0);

        const videoTexture = new THREE.VideoTexture(video);
        const videoMaterial = new THREE.MeshBasicMaterial({
          map: videoTexture,
          side: THREE.DoubleSide
        });

        // Плоскость имеет пропорцию 4:3, как у маркера.
        const videoPlane = new THREE.Mesh(
          new THREE.PlaneGeometry(1, 0.75),
          videoMaterial
        );

        anchor.group.add(videoPlane);

        anchor.onTargetFound = () => {
          status.textContent = "Маркер найден";

          video.play().catch((error) => {
            console.error("Ошибка запуска видео:", error);
            status.textContent = "Не удалось запустить видео";
          });
        };

        anchor.onTargetLost = () => {
          status.textContent = "Наведите камеру на маркер";
          video.pause();
        };

        status.textContent = "Запрашиваем доступ к камере…";
        await mindarThree.start();

        startButton.style.display = "none";
        status.textContent = "Наведите камеру на маркер";

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });
      } catch (error) {
        console.error("Ошибка запуска AR:", error);
        status.textContent =
          "Ошибка: " + (error.message || String(error));

        startButton.disabled = false;
        startButton.textContent = "Попробовать снова";
      }
    }
  </script>
</body>
</html>
