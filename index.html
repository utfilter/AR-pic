<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="./mindar-image.prod.js"></script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #container { width: 100%; height: 100%; position: relative; }
      #ar-video { display: none; position: absolute; transform-origin: top left; z-index: 10; pointer-events: none; }
      /* Стили для принудительного растягивания камеры на весть экран */
      #container video, .mindar-ui-overlay { width: 100% !important; height: 100% !important; object-fit: cover !important; position: absolute; top: 0; left: 0; }
    </style>
  </head>
  <body>

    <div id="container">
      <video id="ar-video" src="./video.mp4" loop muted playsinline webkit-playsinline></video>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const video = document.querySelector("#ar-video");
        const container = document.querySelector("#container");

        // Инициализируем чистый MindAR
        const mindarImage = new window.MINDAR.IMAGE.MindARImage({
          container: container,
          imageTargetSrc: './targets.mind',
          filterMinCF: 0.0001,
          filterBeta: 0.001
        });

        // Запуск камеры с явным указанием параметров для Android
        navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        }).then((stream) => {
          // Если системный поток получен успешно, передаем его в MindAR
          mindarImage.start();
          console.log("Камера принудительно запущена");
        }).catch(err => {
          // Если телефон всё равно блокирует доступ
          alert("Браузер не смог открыть заднюю камеру. Проверьте разрешения Chrome в Android: " + err);
        });

        mindarImage.on("targetFound", (index) => {
          const pos = mindarImage.getCoordinate(index);
          if (pos) {
            video.style.left = pos.left + "px";
            video.style.top = pos.top + "px";
            video.style.width = pos.width + "px";
            video.style.height = pos.height + "px";
            video.style.display = "block";
            video.play();
          }
        });

        mindarImage.on("targetUpdate", (index) => {
          const pos = mindarImage.getCoordinate(index);
          if (pos) {
            video.style.left = pos.left + "px";
            video.style.top = pos.top + "px";
            video.style.width = pos.width + "px";
            video.style.height = pos.height + "px";
          }
        });

        mindarImage.on("targetLost", () => {
          video.pause();
          video.style.display = "none";
        });
      });
    </script>
  </body>
</html>
