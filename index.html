<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Подключаем только базовое ядро MindAR, которое вы сейчас скачали -->
    <script src="./mindar-image.prod.js"></script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #container { width: 100%; height: 100%; position: relative; }
      /* Элемент видео будет скрыт до момента распознавания козы */
      #ar-video { display: none; position: absolute; transform-origin: top left; z-index: 10; pointer-events: none; }
      /* Растягиваем видеопоток камеры на 100% мобильного экрана без искажений */
      #container video { width: 100% !important; height: 100% !important; object-fit: cover !important; position: absolute; top: 0; left: 0; }
    </style>
  </head>
  <body>

    <div id="container">
      <!-- Наш видеоролик -->
      <video id="ar-video" src="./video.mp4" loop muted playsinline webkit-playsinline></video>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const video = document.querySelector("#ar-video");
        const container = document.querySelector("#container");

        // Инициализация чистого контроллера распознавания картинок
        const mindarImage = new window.MINDAR.IMAGE.MindARImage({
          container: container,
          imageTargetSrc: './targets.mind',
          filterMinCF: 0.0001,
          filterBeta: 0.001
        });

        // Прямой запуск веб-камеры смартфона в браузере
        mindarImage.start().then(() => {
          console.log("Камера успешно активирована в высоком разрешении");
        }).catch(err => {
          alert("Ошибка доступа к камере. Убедитесь, что выданы разрешения в настройках Chrome: " + err);
        });

        // Событие: картинка успешно найдена в кадре
        mindarImage.on("targetFound", (index) => {
          const pos = mindarImage.getCoordinate(index);
          if (pos) {
            video.style.left = pos.left + "px";
            video.style.top = pos.top + "px";
            video.style.width = pos.width + "px";
            video.style.height = pos.height + "px";
            video.style.display = "block";
            video.play();
          }
        });

        // Событие: телефон двигается, обновляем координаты видео на экране телефона
        mindarImage.on("targetUpdate", (index) => {
          const pos = mindarImage.getCoordinate(index);
          if (pos) {
            video.style.left = pos.left + "px";
            video.style.top = pos.top + "px";
            video.style.width = pos.width + "px";
            video.style.height = pos.height + "px";
          }
        });

        // Событие: картинка ушла из поля зрения камеры
        mindarImage.on("targetLost", () => {
          video.pause();
          video.style.display = "none";
        });
      });
    </script>
  </body>
</html>
