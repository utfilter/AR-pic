<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js"></script>
    <style>
      /* Принудительно растягиваем видеопоток камеры на весь экран без черных полос */
      html, body { margin: 0; overflow: hidden; background: #000; width: 100%; height: 100%; }
      .a-canvas { width: 100% !important; height: 100% !important; object-fit: cover !important; }
      video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
      
      /* Полностью скрываем рамку сканирования и белые уголки с экрана */
      .mindar-ui-scanning, .mindar-ui-loading { display: none !important; }
    </style>
  </head>
  <body>

    <!-- Отключаем встроенный UI сканирования uiScanning: no -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF:0.0001; filterBeta:0.005; uiScanning: no;" 
             embedded
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="ar-video" src="./video.mp4" preload="none" loop muted playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      
        <!-- Универсальный прямоугольный размер видеоролика под картинку козы -->
        <a-video src="#ar-video" width="1.4" height="0.8" position="0 0 0" rotation="0 0 0"></a-video>
      
    </a-scene>

    <script>
      const targetEntity = document.querySelector('#target-entity');
      const video = document.querySelector('#ar-video');
      
      targetEntity.addEventListener("targetFound", () => { video.play(); });
      targetEntity.addEventListener("targetLost", () => { video.pause(); });
    </script>
  </body>
</html>
