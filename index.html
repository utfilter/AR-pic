<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>WebAR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #startButton {
      position: fixed;
      z-index: 10;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 22px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-size: 18px;
    }

    #message {
      display: none;
      position: fixed;
      z-index: 20;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 12px;
      border-radius: 6px;
      background: #fff;
      color: #111;
      overflow-wrap: anywhere;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <button id="startButton">Включить камеру</button>
  <div id="message"></div>

  <video
    id="video"
    src="./video.mp4"
    preload="auto"
    playsinline
    webkit-playsinline
    muted
    loop
    crossorigin="anonymous">
  </video>

  <a-scene
    mindar-image="imageTargetSrc: ./target.mind; autoStart: false; uiLoading: no; uiScanning: yes; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="arVideo"
        src="./video.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        muted
        loop
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="marker" mindar-image-target="targetIndex: 0">
      <!-- Размер 4:3: видео заполняет всю область маркера -->
      <a-video
        src="#arVideo"
        width="1"
        height="0.75"
        position="0 0 0.01">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    const button = document.getElementById("startButton");
    const message = document.getElementById("message");
    const video = document.getElementById("arVideo");
    const marker = document.getElementById("marker");
    const scene = document.querySelector("a-scene");

    function showMessage(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    marker.addEventListener("targetFound", async () => {
      try {
        video.muted = true;
        await video.play();
      } catch (error) {
        showMessage("Маркер найден, но видео не запустилось: " + error.message);
      }
    });

    marker.addEventListener("targetLost", () => {
      video.pause();
    });

    button.addEventListener("click", async () => {
      button.disabled = true;
      button.textContent = "Запускаю камеру…";
      message.style.display = "none";

      try {
        await new Promise((resolve) => {
          if (scene.hasLoaded) resolve();
          else scene.addEventListener("loaded", resolve, { once: true });
        });

        await scene.systems["mindar-image"].start();
        button.style.display = "none";
      } catch (error) {
        button.disabled = false;
        button.textContent = "Попробовать снова";
        showMessage("Не удалось запустить AR: " + (error.message || error));
      }
    });
  </script>
</body>
</html>
